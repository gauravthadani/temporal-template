[project]
name = "docproc-bench"
version = "0.1.0"
description = "Reproducer for temporalio 1.29 + Python 3.12 memory cliff on sandboxed workflows"
requires-python = ">=3.10,<3.14"
dependencies = [
    "temporalio",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docproc_bench"]

[tool.uv]
